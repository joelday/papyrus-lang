version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /src/papyrus-lang-vscode
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
