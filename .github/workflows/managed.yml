name: Managed

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check for Bethesda binaries
        shell: bash
        run: bash scripts/check-no-bethesda-binaries.sh

      - name: Restore
        run: dotnet restore Papyrus.sln

      - name: Build
        run: dotnet build Papyrus.sln --no-restore --configuration Release

      - name: Architecture tests
        run: dotnet test tests/Papyrus.Architecture.Tests --no-restore --configuration Release --no-build

      - name: CodeAnalysis tests
        run: dotnet test tests/Papyrus.CodeAnalysis.Tests --no-restore --configuration Release --no-build

      - name: Pex tests
        run: dotnet test tests/Papyrus.Pex.Tests --no-restore --configuration Release --no-build

      - name: Compiler tests
        run: dotnet test tests/Papyrus.Compiler.Tests --no-restore --configuration Release --no-build

      - name: Differential compliance
        run: dotnet run --no-build --no-restore --configuration Release --project src/Papyrus.Compiler/Papyrus.Compiler.csproj -- verify --compile --game skyrimse

      - name: Workspaces tests
        run: dotnet test tests/Papyrus.Workspaces.Tests --no-restore --configuration Release --no-build

      - name: LanguageServer tests
        run: dotnet test tests/Papyrus.LanguageServer.Tests --no-restore --configuration Release --no-build

  aot-smoke:
    name: NativeAOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            papyrusc: papyrusc.exe
            language_server: Papyrus.LanguageServer.exe
          - os: ubuntu-latest
            rid: linux-x64
            papyrusc: papyrusc
            language_server: Papyrus.LanguageServer
          # macos-latest is Apple Silicon. Smoke osx-arm64 only on that runner.
          - os: macos-latest
            rid: osx-arm64
            papyrusc: papyrusc
            language_server: Papyrus.LanguageServer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish papyrusc
        run: dotnet publish src/Papyrus.Compiler -c Release -r ${{ matrix.rid }} /p:PublishAot=true -o artifacts/papyrusc-${{ matrix.rid }}

      - name: Smoke papyrusc --version
        run: artifacts/papyrusc-${{ matrix.rid }}/${{ matrix.papyrusc }} --version

      - name: Publish language server
        run: dotnet publish src/Papyrus.LanguageServer -c Release -r ${{ matrix.rid }} /p:PublishAot=true -o artifacts/Papyrus.LanguageServer-${{ matrix.rid }}

      - name: Smoke language server --version
        run: artifacts/Papyrus.LanguageServer-${{ matrix.rid }}/${{ matrix.language_server }} --version

  pack:
    name: Pack Papyrus.Pex
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/Papyrus.Pex/Papyrus.Pex.csproj --configuration Release --output artifacts/nuget

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: papyrus-pex-nupkg
          path: artifacts/nuget/*.nupkg

      # Publish is disabled. Uncomment only for a deliberate nuget.org release
      # from a trusted branch — never on pull_request.
      # - name: Push to nuget.org
      #   if: github.event_name == 'workflow_dispatch'
      #   env:
      #     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      #   run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
