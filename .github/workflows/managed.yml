name: Managed

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check for Bethesda binaries
        shell: bash
        run: bash scripts/check-no-bethesda-binaries.sh

      - name: Restore
        run: dotnet restore Papyrus.sln

      - name: Build
        run: dotnet build Papyrus.sln --no-restore --configuration Release
