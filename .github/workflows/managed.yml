name: Managed

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check for Bethesda binaries
        shell: bash
        run: bash scripts/check-no-bethesda-binaries.sh

      - name: Restore
        run: dotnet restore Papyrus.sln

      - name: Build
        run: dotnet build Papyrus.sln --no-restore --configuration Release

      - name: Architecture tests
        run: dotnet test tests/Papyrus.Architecture.Tests --no-restore --configuration Release --no-build

      - name: CodeAnalysis tests
        run: dotnet test tests/Papyrus.CodeAnalysis.Tests --no-restore --configuration Release --no-build

      - name: Pex tests
        run: dotnet test tests/Papyrus.Pex.Tests --no-restore --configuration Release --no-build

      - name: Compiler tests
        run: dotnet test tests/Papyrus.Compiler.Tests --no-restore --configuration Release --no-build

      - name: Differential compliance
        run: dotnet run --no-build --no-restore --configuration Release --project src/Papyrus.Compiler/Papyrus.Compiler.csproj -- verify --compile --game skyrimse

      - name: Workspaces tests
        run: dotnet test tests/Papyrus.Workspaces.Tests --no-restore --configuration Release --no-build

  aot-smoke:
    name: papyrusc NativeAOT (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish NativeAOT
        run: dotnet publish src/Papyrus.Compiler -c Release -r win-x64 /p:PublishAot=true -o artifacts/papyrusc-win-x64

      - name: Smoke --version
        run: artifacts/papyrusc-win-x64/papyrusc.exe --version

  pack:
    name: Pack Papyrus.Pex
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/Papyrus.Pex/Papyrus.Pex.csproj --configuration Release --output artifacts/nuget

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: papyrus-pex-nupkg
          path: artifacts/nuget/*.nupkg

      # Publish is disabled. Uncomment only for a deliberate nuget.org release
      # from a trusted branch — never on pull_request.
      # - name: Push to nuget.org
      #   if: github.event_name == 'workflow_dispatch'
      #   env:
      #     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      #   run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
